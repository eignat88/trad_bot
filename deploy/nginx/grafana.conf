# Nginx reverse proxy for Grafana
# Place at /etc/nginx/sites-available/grafana
# Enable: ln -s /etc/nginx/sites-available/grafana /etc/nginx/sites-enabled/grafana
# Then:   nginx -t && systemctl reload nginx
#
# For HTTPS, use certbot:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d grafana.yourdomain.com

# HTTP → HTTPS redirect (enable after certbot setup)
# server {
#     listen 80;
#     server_name grafana.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl;  # uncomment after certbot
    server_name grafana.yourdomain.com;

    # SSL config (uncomment after certbot)
    # ssl_certificate /etc/letsencrypt/live/grafana.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/grafana.yourdomain.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Grafana Live)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Grafana analytics
    location /api/live/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
