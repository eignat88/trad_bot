name: ME Inverse SHORT V2 Source-Only CI

on:
  pull_request:
    paths:
      - 'scanner_runner.py'
      - 'app/paper/me_long_v2_inverse_short_v2/**'
      - 'tests/test_me_inverse_short_v2_source_only.py'
      - 'tests/test_me_inverse_short_v2_deployment_v1.py'
      - 'tests/test_me_long_v2_inverse_short_v2_source_capture.py'
      - '.github/workflows/me-inverse-short-v2-source-only-ci.yml'
  workflow_dispatch:

jobs:
  source-only-regression:
    name: Source-only and negative wiring controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      ME_INVERSE_SHORT_V1_ENABLED: '0'
      ME_INVERSE_SHORT_V2_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install pytest pyyaml python-dotenv numpy pandas scipy pg8000 httpx jsonschema
      - name: Verify source-only and historical V2 contracts
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_me_inverse_short_v2_source_only.py \
            tests/test_me_inverse_short_v2_deployment_v1.py \
            tests/test_me_long_v2_inverse_short_v2_isolation_v1.py \
            tests/test_me_long_v2_inverse_short_v2_source_capture.py \
            tests/test_me_r_close_location_orchestrator_isolation.py \
            --tb=short
