name: PR227 Native Windows Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/research/htf_baseline_short_phase2_incremental_cache_v1.py'
      - 'tests/test_htf_baseline_short_phase2_issue226_*'
      - '.github/workflows/pr227-native-windows-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-regression:
    name: Native Windows PR227 (research only)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml python-dotenv numpy pandas scipy
      - name: Native Windows persistence, locking, crash and DACL
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: '.'
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_htf_baseline_short_phase2_issue226_native_windows_v1.py tests/test_htf_baseline_short_phase2_issue226_review_fixes_v1.py --tb=short
      - name: Existing recovery, concurrency, causal parity and budget regressions
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: '.'
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_htf_baseline_short_phase2_issue226_bounded_recovery_v1.py tests/test_htf_baseline_short_phase2_issue226_concurrency_lock_v1.py tests/test_htf_baseline_short_phase2_issue226_causal_parity_v1.py tests/test_htf_baseline_short_phase2_issue226_api_budget_v1.py --tb=short
