name: PR227 Linux Full Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/research/htf_baseline_short_phase2_incremental_cache_v1.py'
      - 'tests/test_htf_baseline_short_phase2_*'
      - '.github/workflows/pr227-linux-full-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml python-dotenv numpy pandas scipy
      - name: Linux full cache regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: '.'
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_htf_baseline_short_phase2_incremental_cache_v1.py \
            tests/test_htf_baseline_short_phase2_issue226_bounded_recovery_v1.py \
            tests/test_htf_baseline_short_phase2_issue226_concurrency_lock_v1.py \
            tests/test_htf_baseline_short_phase2_issue226_api_budget_v1.py \
            tests/test_htf_baseline_short_phase2_issue226_causal_parity_v1.py \
            tests/test_htf_baseline_short_phase2_issue226_review_fixes_v1.py \
            tests/test_htf_baseline_short_phase2_issue226_native_windows_v1.py \
            --tb=short
      - name: Integration smoke
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: '.'
        run: |
          python tests/test_htf_baseline_short_phase2_issue226_integration_smoke.py
