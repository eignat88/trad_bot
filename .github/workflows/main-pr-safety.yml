name: Main PR Safety

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-pr-safety-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-pr-safety:
    name: Main PR Safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml python-dotenv numpy pandas scipy

      - name: Compile Python sources
        run: |
          python -m compileall -q app tests tools scanner_runner.py paper_runner.py bot.py

      - name: Run baseline safety tests
        env:
          PYTHONPATH: .
          ME_R_V3_PG_INTEGRATION: 'false'
          ME_R_V3_ATOMIC_E2E: 'false'
        run: |
          python -m pytest -q -p no:cacheprovider             tests/test_paper_safety_gate_config.py             --tb=short
