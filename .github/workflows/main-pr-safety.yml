name: Main PR Safety

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-pr-safety-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-pr-safety:
    name: Main PR Safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml python-dotenv numpy pandas scipy

      - name: Compile Python sources
        run: |
          python -m compileall -q app tests tools scanner_runner.py paper_runner.py bot.py

      - name: Run baseline safety tests
        env:
          PYTHONPATH: .
          ME_R_V3_PG_INTEGRATION: 'false'
          ME_R_V3_ATOMIC_E2E: 'false'
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_paper_safety_gate_config.py \
            --tb=short

      - name: Fetch PR base for HTF Phase-2 scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Detect HTF Phase-2 changes
        if: github.event_name == 'pull_request'
        id: htf_phase2_scope
        shell: bash
        run: |
          git diff --name-only -z "origin/${{ github.base_ref }}...HEAD" > /tmp/htf_phase2_changed_files
          python3 - <<'PY_SCOPE'
          import os
          from pathlib import Path

          paths = [
              p.decode('utf-8', 'surrogateescape')
              for p in Path('/tmp/htf_phase2_changed_files').read_bytes().split(b'\0')
              if p
          ]
          relevant = any(
              'htf_baseline_short_phase2' in p.lower()
              for p in paths
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"changed={'true' if relevant else 'false'}\n")
          print(f"HTF_PHASE2_RELEVANT={relevant}")
          PY_SCOPE

      - name: Verify HTF Phase-2 isolation
        if: github.event_name == 'pull_request' && steps.htf_phase2_scope.outputs.changed == 'true'
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          git fetch --no-tags origin             "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          python -m pytest -q -p no:cacheprovider \
            tests/test_htf_baseline_short_phase2_isolation_v1.py \
            --tb=short
