name: ME Inverse SHORT OOS-2 PostgreSQL CI

on:
  pull_request:
    branches: [main]
    paths:
      - requirements.txt
      - scanner_runner.py
      - app/paper/me_long_v2_inverse_short_oos2_v1/**
      - tests/test_me_long_v2_inverse_short_oos2_*.py
      - tests/test_me_inverse_short_oos2_*.py
      - sql/migrations/088_me_long_v2_inverse_short_oos2_v1.sql
      - scripts/me_inverse_short_oos2_*.py
      - monitoring/grafana/dashboards/me-inverse-short-oos-2.json
      - deploy/env/me-inverse-short-oos2-runtime.env.example
      - deploy/systemd/trad-bot-me-inverse-short-oos2-runtime.service
      - .github/workflows/me-inverse-short-oos2-preflight-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oos2-postgres-integration:
    name: OOS-2 unit and PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: trad_bot_oos2_it_278
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trad_bot_oos2_it_278"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '5432'
      TEST_DB_NAME: trad_bot_oos2_it_278
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      PRODUCTION_DB_NAME: trad_bot
      TEST_DB_ALLOW_PRODUCTION: '0'
      ME_INVERSE_SHORT_OOS2_ENABLED: '0'
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned Git baseline is available
        run: |
          git cat-file -e 6bc7ea777d606a3068e7ff62aef2b8d771be19a4^{commit}
          git show 6bc7ea777d606a3068e7ff62aef2b8d771be19a4:scanner_runner.py > /dev/null
          git ls-tree 6bc7ea777d606a3068e7ff62aef2b8d771be19a4 app/paper/me_long_v2_inverse_short_v1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml python-dotenv numpy pandas scipy
          python -m pip check
      - name: Verify isolated test database
        run: |
          python - <<'PY'
          import os
          import pg8000
          db = os.environ["TEST_DB_NAME"]
          assert db == "trad_bot_oos2_it_278" and db != os.environ["PRODUCTION_DB_NAME"]
          conn = pg8000.connect(
              host=os.environ["TEST_DB_HOST"],
              port=int(os.environ["TEST_DB_PORT"]),
              database=db,
              user=os.environ["TEST_DB_USER"],
              password=os.environ["TEST_DB_PASSWORD"],
          )
          cur = conn.cursor()
          cur.execute("SELECT current_database()")
          assert cur.fetchone()[0] == db
          conn.close()
          print("Isolated PostgreSQL 17 test DB: PASS")
          PY
      - name: OOS-2 isolated offline and PostgreSQL regression
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_me_inverse_short_oos2_dashboard_v1.py \
            tests/test_me_inverse_short_oos2_deployment_v1.py \
            tests/test_me_long_v2_inverse_short_oos2_entry_ttl_v1.py \
            tests/test_me_long_v2_inverse_short_oos2_isolation_v1.py \
            tests/test_me_long_v2_inverse_short_oos2_ladder_v1.py \
            tests/test_me_long_v2_inverse_short_oos2_source_capture.py \
            tests/test_me_long_v2_inverse_short_oos2_durability_hardening_v1.py \
            tests/test_me_long_v2_inverse_short_oos2_pg_admission_it_v1.py \
            tests/test_me_long_v2_inverse_short_oos2_ttl_lockwait_pg_it_v1.py \
            tests/test_me_long_v2_inverse_short_oos2_partial_restart_pg_it_v1.py \
            -rs --tb=short

# Runs only on an ephemeral CI PostgreSQL service. No VPS, production
# database credentials, systemd, deploy, activation, backfill or live orders.
