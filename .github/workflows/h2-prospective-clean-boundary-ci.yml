name: H2 Clean Activation Boundary CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/research/me_entry_quality_h2_prospective_v1/**'
      - 'tests/test_me_entry_quality_h2_prospective_*.py'
      - 'sql/migrations/097_h2_prospective_clean_activation_v1.sql'
      - 'deploy/sql/312_h2_prospective_role.sql'
      - 'deploy/systemd/trad-bot-h2-prospective-runtime.service'
      - '.github/workflows/h2-prospective-clean-boundary-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: h2_ci_only_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest psycopg2-binary numpy pandas scipy python-dotenv
      - name: Verify isolated PostgreSQL target
        env:
          PGPASSWORD: h2_ci_only_password
        run: |
          python - <<'PY'
          import psycopg2
          conn = psycopg2.connect(host="127.0.0.1", port=55432, user="postgres", password="h2_ci_only_password", dbname="postgres")
          with conn.cursor() as cur:
              cur.execute("SELECT current_database(), current_setting('port'), pg_is_in_recovery()")
              assert cur.fetchone() == ("postgres", "5432", False)
          conn.close()
          PY
      - name: Compile H2 runtime and regression tests
        run: |
          python -m compileall -q app/research/me_entry_quality_h2_prospective_v1
          python -m compileall -q tests/test_me_entry_quality_h2_prospective_*.py
      - name: H2 offline and real-PG scratch integration
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          ME_H2PRO_PG_INTEGRATION: '1'
          ME_H2PRO_PG_IT_HOST: '127.0.0.1'
          ME_H2PRO_PG_IT_PORT: '55432'
          ME_H2PRO_PG_IT_USER: 'postgres'
          PGPASSWORD: h2_ci_only_password
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_me_entry_quality_h2_prospective_*.py --tb=short
