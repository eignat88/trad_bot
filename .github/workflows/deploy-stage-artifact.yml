name: Deploy Stage Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stage-artifact
  cancel-in-progress: false

jobs:
  stage-artifact:
    name: Build isolated release artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout selected main commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml python-dotenv numpy pandas scipy

      - name: Validate offline baseline
        env:
          PYTHONPATH: .
          ME_R_V3_PG_INTEGRATION: 'false'
          ME_R_V3_ATOMIC_E2E: 'false'
        run: |
          set -euo pipefail
          python -m compileall -q app scanner_runner.py paper_runner.py bot.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_paper_safety_gate_config.py --tb=short

      - name: Package allowlisted tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage-package"
          git archive --format=tar HEAD -- \
            app scanner_runner.py paper_runner.py bot.py requirements.txt \
            | tar -xf - -C "$RUNNER_TEMP/stage-package"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/stage-package/RELEASE_COMMIT"
          tar -C "$RUNNER_TEMP/stage-package" -czf "$RUNNER_TEMP/tradbot-stage-$GITHUB_SHA.tar.gz" .
          ( cd "$RUNNER_TEMP" && \
            sha256sum "tradbot-stage-$GITHUB_SHA.tar.gz" \
              | tee "tradbot-stage-$GITHUB_SHA.sha256" )
          ( cd "$RUNNER_TEMP" && \
            sha256sum --check "tradbot-stage-$GITHUB_SHA.sha256" )
          echo "STAGE_ARTIFACT_ONLY=true" >> "$GITHUB_STEP_SUMMARY"
          echo "COMMIT=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "NO_VPS_OR_PRODUCTION_CHANGES=true" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload isolated stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradbot-stage-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tradbot-stage-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/tradbot-stage-${{ github.sha }}.sha256
          if-no-files-found: error
          retention-days: 7
