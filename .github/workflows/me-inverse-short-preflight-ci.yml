name: ME Inverse SHORT Preflight CI

on:
  pull_request:
    branches: [main]
    paths:
      - requirements.txt
      - scripts/me_inverse_short_v1_preflight.py
      - scripts/me_inverse_short_v1_activate.py
      - tests/test_me_inverse_short_*.py
      - app/paper/me_long_v2_inverse_short_v1/**
      - .github/workflows/me-inverse-short-preflight-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-offline:
    name: Inverse SHORT preflight and regression (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install compatible isolated dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml python-dotenv numpy pandas scipy
          python -m pip check
      - name: Compile changed operator code
        run: |
          python -m compileall -q \
            scripts/me_inverse_short_v1_preflight.py \
            scripts/me_inverse_short_v1_activate.py \
            tests/test_me_inverse_short_preflight_v1.py \
            tests/test_me_inverse_short_activation_operator_env_v1.py \
            tests/test_me_inverse_short_dependency_compat_v1.py
      - name: Offline preflight, activation and contour regressions
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          ME_INVERSE_SHORT_V1_ENABLED: '0'
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_me_inverse_short_preflight_v1.py \
            tests/test_me_inverse_short_activation_operator_env_v1.py \
            tests/test_me_inverse_short_dependency_compat_v1.py \
            tests/test_me_long_v2_inverse_short_v1.py \
            tests/test_me_long_v2_inverse_short_production_runtime_v1.py \
            --tb=short

# No DB credentials, network market-data calls, systemd, VPS access or
# deployment actions. The test suites use mocks/in-memory fixtures only.
